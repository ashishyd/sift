appId: app.sift.desktop
productName: Sift
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
mac:
  category: public.app-category.utilities
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: Sift scans your Documents folder to find large or old files you may want to clear.
    - NSDownloadsFolderUsageDescription: Sift scans your Downloads folder to find large or old files you may want to clear.
    - NSDesktopFolderUsageDescription: Sift scans your Desktop to find large or old files you may want to clear.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
